<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5394">
<script>try{document.documentElement.dataset.theme=localStorage.mc_theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Collector</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{color-scheme:light;--b:#0b5394;--o:#f5a623;--bg:#f4f6f8;--t:#1d2733;--m:#6b7785;--l:#d5dbe1;--c:#fff;--s:#e6ebf0;--ro:#eef1f4}
:root[data-theme=dark]{color-scheme:dark;--b:#3a7fc8;--bg:#12181f;--t:#e6ebf0;--m:#9aa7b4;--l:#2c3744;--c:#1b232c;--s:#2a3541;--ro:#222c36}
[data-theme=dark] header{background:#0f2d4d}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center}
header h1{font-size:1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--b);color:#fff;cursor:pointer;display:inline-block}
button.s,.btn.s{background:var(--s);color:var(--t)}button.o{background:var(--o);color:var(--t)}button.d{background:#c0392b}
main{max-width:900px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:10px}
summary{font-weight:600;cursor:pointer;color:var(--b)}details[open]>summary{margin-bottom:10px}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
label.f{display:flex;flex-direction:column;font-size:.8rem;color:var(--m);gap:2px}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--l);border-radius:8px;width:100%;background:var(--c);color:var(--t)}
input[readonly]{background:var(--ro)}
.stp input{text-align:center}.w.stp button{padding:6px 14px;font-size:1.2rem;font-weight:700;touch-action:manipulation}.w.stp button:first-of-type{order:-1}input[type=range]{padding:0;border:0;margin-top:6px;accent-color:var(--b)}
.w{display:flex;gap:4px}.w input{flex:1;min-width:0}.w button{padding:6px 8px}
.g{margin:8px 0}.g>b{font-size:.85rem}.c{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.ch{position:relative}.ch input{position:absolute;opacity:0;width:1px;height:1px}
.ch span{display:block;padding:7px 12px;border:1px solid var(--l);border-radius:20px;background:var(--c)}
.ch input:checked+span{background:var(--b);color:#fff;border-color:var(--b)}
.ch input:focus-visible+span{outline:2px solid var(--o)}
.m{color:var(--m);font-size:.85rem}.a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.a button{padding:6px 10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--l);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:300px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:8px 16px;border-radius:20px;z-index:9;font-size:.9rem}

#mo{position:fixed;inset:0;z-index:20;background:var(--c);display:flex;flex-direction:column}
#mo .mt{display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--b)}#mo .mt form{flex:1;margin:0}
#mapc{flex:1;min-height:0;position:relative;z-index:0}
#sr{position:absolute;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top));background:var(--c);border:1px solid var(--l);border-radius:10px;max-height:40vh;overflow:auto;z-index:5;box-shadow:0 4px 14px #0003}
#sr button{display:block;width:100%;text-align:left;background:var(--c);color:var(--t);border-radius:0;border-bottom:1px solid var(--l)}
.mb{padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--l)}
.pin{font-size:30px;line-height:30px}
.pg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph{position:relative}.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--l);display:block}.ph button{position:absolute;top:2px;right:2px;padding:2px 7px}
</style></head><body>
<header><h1>Collector · ATD Questembert</h1><button id="inst" class="s" hidden>⬇ Installer</button><button id="new" class="o">＋ Nouvelle fiche</button><button id="back" class="s" hidden>← Liste</button><button id="th" class="s" type="button" aria-label="Basculer entre thème clair et sombre">🌙</button></header>
<main>
<section id="lv">
 <div class="card"><input id="q" type="search" placeholder="Rechercher (commune, RD, incident…)"><p class="m" id="cnt"></p><button id="mapb" class="s" type="button">🧭 Rechercher un lieu / guidage</button></div>
 <details class="card"><summary>Export / sauvegarde</summary>
  <div class="r"><label class="f">Du<input id="d1" type="date"></label><label class="f">Au<input id="d2" type="date"></label></div>
  <div class="a"><button id="xg">Export QGIS (GeoJSON)</button><button id="xz">Export QGIS + photos (ZIP)</button><button id="xc">Export CSV</button><button id="xp">Export PDF</button><button id="xj" class="s">Sauvegarde JSON</button><label class="btn s">Importer JSON<input id="imp" type="file" accept=".json,.txt,application/json,text/plain" hidden></label></div>
  <div class="a" id="shr" hidden><b>Envoyer (WhatsApp, messagerie, e-mail…) :</b><button id="sg" class="s" type="button">📤 GeoJSON</button><button id="sc" class="s" type="button">📤 CSV</button><button id="sz" class="s" type="button">📤 ZIP QGIS</button><button id="sp" class="s" type="button">📤 PDF</button><button id="sj" class="s" type="button">📤 Sauvegarde</button></div>
  <p class="m">GeoJSON : points GPS (WGS84, EPSG:4326). CSV : colonnes Route / Cumul_Debut pour le référencement linéaire (LRS), plus lat/lon.</p>
 </details>
 <div id="L"></div>
</section>
<section id="fv" hidden><form id="F" autocomplete="off" onsubmit="return false"></form>
 <div class="bar"><button id="save">Enregistrer</button><button id="cancel" class="s">Annuler</button></div></section>
</main>
<div id="mo" hidden>
 <div class="mt"><form id="sf" class="w"><input id="sq" type="search" placeholder="Adresse, commune, lieu… ou lat, lon"><button>🔍</button></form><button id="mx" class="s" type="button">✕</button></div>
 <div id="sr" hidden></div>
 <div id="mapc"></div>
 <div class="mb"><div class="m" id="mi">Touchez la carte pour placer un point</div>
  <div class="a"><button id="mu" class="o" disabled>✔ Utiliser ce point</button><button id="mg" disabled>🧭 Guidage</button><button id="mw" class="s" disabled>Waze</button><button id="mp" class="s">📍 Ma position</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),F=$('#F');
let D,cur,fiches=JSON.parse(localStorage.mc||'[]');
const save=()=>localStorage.mc=JSON.stringify(fiches);
const CH={
astreinte:["En astreinte","Hors astreinte"],
origine:["Gendarmerie","Pompier CODIS","DIRO","Chef d'équipe ou Technicien","Autre"],
incident:["Chute d'arbre","Objet sur la chaussée","Véhicule en panne","Véhicule au fossé","Animaux morts","Gravillon-sable-terre","Gasoil","Boue","Autres"],
circulation:["Normale","Alternée","Bloquée","Déviation","Autres"],
usager:["V.L.","P.L.","2 Roues","Piétons","Autres"],
gravite:["Dégâts matériels","Dégâts corporels","Tué(s)","Blessé(s) léger(s)","Blessé(s) grave(s)"],
chaussee:["Sèche","Mouillée","Gravillon"],
phenomene:["Tempête","Inondation","Brouillard","Autres"],
pluie:["Faible","Moyenne","Forte","Généralisée"],
neige:["Fraîche","Tassée","Localisé"],
pv:["Oui","Non","Ne sait pas"],
personnes:["Résidence locale","Non local"],
antecedents:["Oui","Non"],
sens:["PR croissant","PR décroissant"],
typeacc:["Collision","Sortie de route","Autres"],
lumiere:["Jour","Nuit","Lever/coucher de soleil"],
env:["Agglo","Péri-urbain","Rase campagne"],
croisement:["Carrefour","Rond point","Courbe","Ligne droite","T à droite","T à gauche"],
facteurs:["Vitesse","Arbre","Muret","Traversée d'animaux","Tête de buse","Poteau EDF / FT","Ponceau","Talus","Autres"]};
const VEH=["V.L","VUL","Camion(s)","Fourgon(s)","Camion spécifique","Tracteur","FLR + remorque","Balayeuse aspiratrice","Remorque à panneaux"],
MU=["Balise","Délinéateurs","Panneaux","Autres"],MM=["Glissières","Peintures","Reprofil accotement","Bordure"],
PERS=["Agents","Chef d'équipe","Chef de site"],MX=["Sablage (m³)","Sel (tonnes)","Absorbant (sacs)"];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>parseFloat(String(v).replace(',','.'))||0;
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmt=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
const hm=h=>Math.floor(h)+' h '+String(Math.round(h%1*60)).padStart(2,'0');
const toast=t=>{const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)};
// --- construction du formulaire
const H=(t,b,o)=>`<details class="card" ${o?'open':''}><summary>${t}</summary>${b}</details>`;
const ch=(k,l)=>`<div class="g"><b>${l}</b><div class="c">${CH[k].map(o=>`<label class="ch"><input type="checkbox" name="${k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div></div>`;
const ti=(k,l,t='text')=>`<label class="f">${l}<input name="${k}" type="${t}"></label>`;
const stp=k=>k.startsWith('veh|')||/\|(we|nuit|norm)$/.test(k)?.5:k.startsWith('mm|')?5:k=='abs'?10:1;
const ni=(k,l,no)=>`<label class="f">${l}<span class="w stp"><input name="${k}" type="number" inputmode="decimal" step="any">${no?'':`<button type="button" class="s" data-f="${k}" data-d="-1" aria-label="Diminuer">−</button><button type="button" class="s" data-f="${k}" data-d="1" aria-label="Augmenter">+</button>`}</span>${k=='abs'?'<input type="range" data-for="abs" min="0" max="2000" step="5" aria-label="Abscisse (curseur)">':''}</label>`;
const ta=(k,l)=>`<label class="f">${l}<textarea name="${k}" rows="3"></textarea></label>`;
const dt=(k,l)=>`<label class="f">${l}<span class="w"><input name="${k}" type="datetime-local"><button type="button" class="s now" data-n="${k}">Maint.</button></span></label>`;
function build(){
 const sites=Object.keys(D.communes);
 F.innerHTML=
 H('Localisation',`<div class="r"><label class="f">Site<select name="site">${sites.map(s=>`<option value="${s}">${s.replace(/_/g,' ')}</option>`).join('')}</select></label>
 <label class="f">Commune<select name="commune"></select></label>${ti('lieudit','Lieu-dit')}
 <label class="f">R.D.<select name="rd"></select></label><label class="f">P.R.<select name="pr"></select></label>${ni('abs','Abscisse (m)')}
 <label class="f">Cumul (m) – calculé<input name="cumul" readonly></label></div>
 <div class="r">${ni('lat','Latitude (WGS84)',1)}${ni('lon','Longitude (WGS84)',1)}<label class="f">Précision GPS (m)<input name="gps_prec" readonly></label><label class="f">Source de la position<input name="loc_source" readonly></label></div>
 <div class="a"><button type="button" id="gps" class="o">📍 Position GPS actuelle</button><button type="button" id="pick" class="s">🗺️ Choisir sur la carte</button><button type="button" id="locb" class="s">🛣️ Déterminer RD / PR / commune</button></div>
 <p class="m" id="locst">Le point GPS ou pointé sur la carte renseigne automatiquement la commune, la RD, le PR et l'abscisse.</p><div class="c" id="localt"></div>`,1)+
 H("Appel et intervention",`<div class="r">${ni('numero','N° fiche du jour')}${dt('hAppel',"Heure d'appel")}${dt('hAcc',"Heure de l'accident")}${dt('dDebut','Début intervention')}${dt('dFin','Fin intervention')}</div>
 ${ch('astreinte','Astreinte')}<p>Temps d'intervention : <b id="tps">—</b></p>`,1)+
 H("Origine de l'appel",`${ch('origine','Origine')}<div class="r">${ti('origine_prec','Autre – précisions')}${ti('interlocuteur','Nom & identification de l’interlocuteur')}${ti('tel','Téléphone','tel')}</div>`)+
 H('Incident et circulation',`${ch('incident','Incident')}${ti('incident_prec','Autres – précisions')}${ch('circulation','Circulation')}${ti('circ_prec','Autres – précisions')}`,1)+
 H('Accident',`${ch('usager','Usager')}${ti('usager_prec','Autres – précisions')}${ch('gravite','Gravité')}<div class="r">${ni('nb_veh','Nbre de véhicules mis en cause')}</div>`)+
 H('Conditions',`${ch('chaussee','État de la chaussée')}${ch('phenomene','Phénomène naturel')}${ti('phen_prec','Autres – précisions')}${ch('pluie','Pluie')}${ch('neige','Neige / Verglas')}
 ${ch('pv','PV forces de l’ordre établi ?')}${ch('personnes','Info personnes accidentées')}${ch('antecedents','Antécédents au même endroit')}`)+
 H("Détail de l'évènement",`${ch('sens','Sens de circulation véhicule')}${ch('typeacc',"Type d'accident")}${ch('lumiere','Lumière')}${ch('env','Environnement')}${ch('croisement','Type de croisement')}
 ${ch('facteurs',"Facteurs connus à l'origine de l'accident et obstacle")}${ti('fact_prec','Autres – précisions')}`)+
 H('Photos',`<div class="a"><button type="button" id="cam" class="o">📷 Prendre une photo</button><button type="button" id="gal" class="s">🖼️ Galerie</button></div><input id="phc" type="file" accept="image/*" capture="environment" hidden><input id="phi" type="file" accept="image/*" multiple hidden><div id="phg" class="pg"></div>`,1)+
 H('Observations',`${ta('infra','Infrastructure à vérifier ou observations diverses')}${ta('obs','Observations')}
 <div class="r">${ti('agent1','Agent 1 (nom / prénom)')}${ti('agent2','Agent 2 (nom / prénom)')}${ti('date_fiche','Date','date')}</div>`,1)+
 H("Données pour état de frais – tiers",`<div class="r">${ti('t_nom','Nom')}${ti('t_prenom','Prénom')}${ti('t_adresse','Adresse')}${ti('t_cp_ville','Code postal / Ville')}${ti('t_tel','Téléphone','tel')}
 ${ti('v_marque','Véhicule – marque')}${ti('v_type','Type')}${ti('v_immat','Immatriculation')}${ti('a_compagnie','Compagnie d’assurance')}${ti('a_agence','Agence')}${ti('a_police','N° police')}</div>`)+
 H('Moyens engagés',`<b>Véhicules (heures)</b><div class="r">${VEH.map(k=>ni('veh|'+k,k)).join('')}</div>
 <b>Matériels (nbre)</b><div class="r">${MU.map(k=>ni('mu|'+k,k)).join('')}</div><b>Matériels (ml)</b><div class="r">${MM.map(k=>ni('mm|'+k,k)).join('')}</div>
 <b>Personnel</b>${PERS.map(k=>`<div class="g"><i>${k}</i><div class="r">${ni(`p|${k}|we`,'H week-end / férié')}${ni(`p|${k}|nuit`,'H nuit (22h-7h)')}${ni(`p|${k}|norm`,'H normale')}${ni(`p|${k}|nb`,'Nombre')}</div></div>`).join('')}
 <p>Heures totales personnel : <b id="ht">0</b></p><b>Matériaux</b><div class="r">${MX.map(k=>ni('mx|'+k,k)).join('')}</div>`);
}
// --- listes en cascade
function popC(){const s=F.site.value;
 F.commune.innerHTML='<option value="">—</option>'+(D.communes[s]||[]).map(c=>`<option>${esc(c[1])}</option>`).join('');
 F.rd.innerHTML='<option value="">—</option>'+(D.rd[s]||[]).map(r=>`<option>${r}</option>`).join('');popPR()}
function popPR(){F.pr.innerHTML='<option value="">—</option>'+(D.pr[F.rd.value]||[]).map(p=>`<option>${esc(p[0])}</option>`).join('')}
// --- lecture / écriture
function read(){const o={};for(const e of F.elements){if(!e.name)continue;
 if(e.type=='checkbox'){(o[e.name]??=[]);if(e.checked)o[e.name].push(e.value)}else if(e.type!='button')o[e.name]=e.value}return o}
function der(f){const p=(D.pr[f.rd]||[]).find(x=>x[0]==f.pr);let ms=f.dDebut&&f.dFin?new Date(f.dFin)-new Date(f.dDebut):NaN;if(ms<0)ms+=864e5;
 return{cumul:p?Math.round(p[1]+n(f.abs)):'',tps_h:isNaN(ms)?'':+(ms/36e5).toFixed(2),
 heures_totales:+PERS.reduce((s,k)=>s+(n(f[`p|${k}|we`])+n(f[`p|${k}|nuit`])+n(f[`p|${k}|norm`]))*n(f[`p|${k}|nb`]),0).toFixed(2)}}
function calc(){F.querySelectorAll('input[data-for]').forEach(r=>r.value=F.elements[r.dataset.for].value);const d=der(read());F.cumul.value=d.cumul;$('#tps').textContent=d.tps_h===''?'—':hm(d.tps_h);$('#ht').textContent=d.heures_totales}
function fill(f){F.reset();F.site.value=f.site;popC();ensOpt(F.rd,f.rd);F.rd.value=f.rd||'';popPR();ensOpt(F.pr,f.pr);ensOpt(F.commune,f.commune);
 for(const e of F.elements){if(!e.name||!(e.name in f))continue;
 if(e.type=='checkbox')e.checked=(f[e.name]||[]).includes(e.value);else if(e.type!='button')e.value=f[e.name]}}
// --- navigation
function show(v){$('#lv').hidden=v!='list';$('#fv').hidden=v!='form';$('#new').hidden=v!='list';$('#back').hidden=v!='form';if(v=='list')renderList()}
function open_(f){orig=f.photos||[];added=[];cur={...f,photos:[...orig]};fill(f);autoRd=false;autoLd=false;LR=null;LRS=[];lseq++;$('#locst').textContent='';$('#localt').innerHTML='';calc();drawPh();show('form');scrollTo(0,0)}
function neu(){const d=new Date(),site=localStorage.mc_site||'Vannes_St_Ave';
 const k=fiches.filter(x=>x.site==site&&new Date(x.cree).toDateString()==d.toDateString()).length+1;
 open_({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',cree:d.toISOString(),site,numero:k,dDebut:nowL(),date_fiche:nowL().slice(0,10)})}
const card=f=>`<div class="card"><b>Fiche n°${esc(f.numero||'?')} · ${fmt(f.dDebut||f.cree)}</b><br>${esc([f.commune,f.rd&&f.rd+(f.pr?' PR '+f.pr:'')+(f.abs?' +'+f.abs:'')].filter(Boolean).join(' · '))}
 <div class="m">${esc([...(f.incident||[]),...(f.typeacc||[]),...(f.circulation||[])].join(', '))} ${f.lat?'📍':'· sans GPS'} ${(f.photos||[]).length?'· 📷'+f.photos.length:''}</div>
 <div class="a"><button class="s" data-a="e" data-i="${f.id}">Modifier</button>${f.lat&&f.lon?`<button class="o" data-a="g" data-i="${f.id}">🧭 Guidage</button>`:''}<button class="s" data-a="s" data-i="${f.id}">📤 Envoyer</button><button class="s" data-a="p" data-i="${f.id}">📄 PDF</button><button class="s" data-a="c" data-i="${f.id}">Dupliquer</button><button class="d" data-a="x" data-i="${f.id}">Supprimer</button></div></div>`;
function renderList(){const q=$('#q').value.toLowerCase();
 const L=fiches.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q)).sort((a,b)=>(b.dDebut||b.cree).localeCompare(a.dDebut||a.cree));
 $('#L').innerHTML=L.length?L.map(card).join(''):'<p class="m">Aucune fiche.</p>';
 $('#cnt').textContent=`${L.length} fiche(s) · ${fiches.filter(f=>f.lat).length} géolocalisée(s) sur ${fiches.length}`}
// --- exports
let SH=0;const dl=(nm,t,m)=>{if(SH)return shr(nm,t,m);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=nm;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)};
const sel=()=>{const a=$('#d1').value,b=$('#d2').value;return fiches.filter(f=>{const d=(f.dDebut||f.cree).slice(0,10);return(!a||d>=a)&&(!b||d<=b)})};
function flat(f){const c=(D.communes[f.site]||[]).find(x=>x[1]==f.commune);
 const o={Route:f.rd,Cumul_Debut:f.cumul,insee:c?c[0]:'',...f};o.nb_photos=(f.photos||[]).length;delete o.photos;for(const k in o)if(Array.isArray(o[k]))o[k]=o[k].join(' | ');return o}
const stamp=()=>new Date().toISOString().slice(0,10);
$('#xg').onclick=()=>{const r=sel().map(flatG).filter(r=>r.lat&&r.lon);if(!r.length)return toast('Aucune fiche géolocalisée');
 dl(`collector_${stamp()}.geojson`,JSON.stringify({type:'FeatureCollection',name:'collector',crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},

 tm.content=t=='dark'?'#0f2d4d':'#0b5394';if(keep)try{localStorage.mc_theme=t}catch(e){}}
thb.onclick=()=>setTh(root.dataset.theme=='dark'?'light':'dark',1);setTh(root.dataset.theme||'light');
// --- installation (bouton masqué une fois installé)
let dp;const inst=$('#inst'),mq=matchMedia('(display-mode: standalone)');
const standalone=()=>mq.matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const refreshInst=()=>inst.hidden=standalone()||!(dp||ios);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;refreshInst()});
addEventListener('appinstalled',()=>{dp=null;inst.hidden=true;toast('Collector installé')});
mq.addEventListener?.('change',refreshInst);refreshInst();
inst.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;refreshInst()}else alert('Pour installer Collector : bouton Partager (carré avec flèche), puis « Sur l’écran d’accueil ».')};
// --- localisation automatique : RD + PR + abscisse (référentiel, même principe que VHMaps) et commune (géocodage inverse BAN)
const shortRd=r=>String(r).replace(/^\d{2}\s+/,'').replace(/^([A-Za-z]+)0+(?=\d)/,'$1').replace(/\s+/g,' ');
const d2=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
function joinLines(a,b){const T=15,as=a[0],ae=a[a.length-1],bs=b[0],be=b[b.length-1];
 if(d2(ae,bs)<T)return a.concat(b.slice(1));if(d2(ae,be)<T)return a.concat(b.slice().reverse().slice(1));
 if(d2(as,be)<T)return b.concat(a.slice(1));if(d2(as,bs)<T)return b.slice().reverse().concat(a.slice(1));return null}
function projectOn(ch,p){let best={d:Infinity,s:0},acc=0;
 for(let i=0;i<ch.length-1;i++){const a=ch[i],b=ch[i+1],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),t=len?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(len*len))):0,d=d2(p,{x:a.x+t*dx,y:a.y+t*dy});
  if(d<best.d)best={d,s:acc+t*len};acc+=len}
 best.L=acc;return best}
function pointAt(ch,s){let acc=0;
 for(let i=0;i<ch.length-1;i++){const a=ch[i],b=ch[i+1],len=d2(a,b);
  if(s<=acc+len||i===ch.length-2){const t=len?Math.max(0,Math.min(1,(s-acc)/len)):0;return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)}}acc+=len}
 return ch[0]}
function buildChains(e,o){const lines=[];
 e.feats.forEach(f=>{const g=f.geometry;(g.type=='LineString'?[g.coordinates]:g.coordinates).forEach(l=>{if(l.length>1)lines.push(l.map(c=>({x:(c[0]-o.lon0)*o.kx,y:(c[1]-o.lat0)*o.ky})))})});
 const covered=(b,a)=>b.every(pt=>projectOn(a,pt).d<8);   // tronçons déclarés en double : on retire ceux entièrement couverts par un autre
 for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++){
  if(covered(lines[j],lines[i])){lines.splice(j,1);j--}else if(covered(lines[i],lines[j])){lines.splice(i,1);i--;break}}
 let ch=true;
 while(ch){ch=false;out:for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++){const r=joinLines(lines[i],lines[j]);if(r){lines[i]=r;lines.splice(j,1);ch=true;break out}}}
 return lines}
// référentiel (pr.json + lineaire.json), limité aux RD de Collector ; chargé à la demande puis mis en cache par le service worker
let RFP;
const ref=()=>RFP||(RFP=Promise.all([fetch('pr.json').then(r=>r.json()),fetch('lineaire.json').then(r=>r.json())]).then(([p,l])=>{
 const ok=new Set(Object.values(D.rd).flat()),ax={},
 get=a=>ok.has(a)?(ax[a]||(ax[a]={axe:a,prs:[],feats:[],b:{s:90,n:-90,w:180,e:-180}})):null,
 ext=(b,a)=>{if(typeof a[0]=='number'){b.s=Math.min(b.s,a[1]);b.n=Math.max(b.n,a[1]);b.w=Math.min(b.w,a[0]);b.e=Math.max(b.e,a[0])}else a.forEach(x=>ext(b,x))};
 p.pr.forEach(q=>{const e=get(q[2]);if(e){e.prs.push(q);ext(e.b,[q[0],q[1]])}});
 l.features.forEach(f=>{const e=get(f.properties.axe);if(e&&f.geometry){e.feats.push(f);ext(e.b,f.geometry.coordinates)}});
 return Object.values(ax).filter(e=>e.feats.length)}).catch(x=>{RFP=null;throw x}));
// site du segment de RD (propriété « site » du linéaire) -> clé des sites de Collector
const SITES={'questembert':'Questembert','muzillac':'Muzillac','grand-champ':'Grand_Champ','la gacilly':'La_Gacilly','vannes / saint-ave':'Vannes_St_Ave'};
const siteKey=v=>{const k=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();return SITES[k]||(D.communes[v]?v:'')};
const siteTxt=k=>String(k||'').replace(/_/g,' ');
// RD les plus proches du point (tolérance tol en mètres) : route, PR et abscisse ; plusieurs résultats possibles aux carrefours
function findRd(la,lo,tol){return ref().then(idx=>{
 const kx=111320*Math.cos(la*Math.PI/180),ky=110574,pl=tol/1e5,pg=tol/(1e5*Math.max(.2,Math.cos(la*Math.PI/180))),cands=[];
 idx.filter(e=>{const b=e.b;return la>=b.s-pl&&la<=b.n+pl&&lo>=b.w-pg&&lo<=b.e+pg}).forEach(e=>{let best=Infinity,bf=null;
  e.feats.forEach(f=>{const g=f.geometry;(g.type=='LineString'?[g.coordinates]:g.coordinates).forEach(l=>{for(let i=0;i<l.length-1;i++){
   const ax=(l[i][0]-lo)*kx,ay=(l[i][1]-la)*ky,bx=(l[i+1][0]-lo)*kx,by=(l[i+1][1]-la)*ky,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy,t=L2?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L2)):0,d=Math.hypot(ax+t*dx,ay+t*dy);
   if(d<best){best=d;bf=f}}})});
  if(bf&&best<=tol)cands.push({e,d:best,f:bf})});
 cands.sort((a,b)=>a.d-b.d);if(!cands.length)return[];
 const o={lon0:lo,lat0:la,kx,ky},d0=cands[0].d,out=[];
 cands.filter(c=>c.d<=d0+10).slice(0,3).forEach(c=>{
  let best=null;buildChains(c.e,o).forEach(ch=>{const pj=projectOn(ch,{x:0,y:0});if(!best||pj.d<best.pj.d)best={ch,pj}});
  if(!best)return;
  const sc=best.pj.s,list=[];
  c.e.prs.forEach(q=>{if(!/^\d+$/.test(String(q[3])))return;const pj=projectOn(best.ch,{x:(q[0]-lo)*kx,y:(q[1]-la)*ky});if(pj.d<200)list.push({n:+q[3],s:pj.s,q})});
  const sn=pointAt(best.ch,sc),r={axe:c.e.axe,site:siteKey(c.f.properties.site),d:c.d,lat:la+sn.y/ky,lon:lo+sn.x/kx,pr:null,m:0,approx:false};
  if(list.length){list.sort((a,b)=>a.n-b.n);let sum=0;for(let i=1;i<list.length;i++)sum+=Math.sign(list[i].s-list[i-1].s);
   const dir=sum<0?-1:1;r.approx=list.length<2;
   const before=list.filter(x=>dir>0?x.s<=sc+5:x.s>=sc-5),
   rf=before.length?before.reduce((a,b)=>dir>0?(b.s>a.s?b:a):(b.s<a.s?b:a)):list.reduce((a,b)=>Math.abs(b.s-sc)<Math.abs(a.s-sc)?b:a);
   r.pr=String(rf.q[3]);r.m=Math.round(dir>0?sc-rf.s:rf.s-sc);if(before.length&&r.m<0)r.m=0}
  out.push(r)});
 return out})}
// commune : géocodage inverse BAN (Géoplateforme, puis ancienne adresse de l'API Adresse en secours)
const BC=new Map();
function ban(la,lo){const k=la.toFixed(5)+','+lo.toFixed(5);if(BC.has(k))return BC.get(k);
 const p=(async()=>{for(const u of['https://data.geopf.fr/geocodage/reverse','https://api-adresse.data.gouv.fr/reverse/']){
  const get=async t=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),7000);
   try{const r=await fetch(`${u}?lon=${lo}&lat=${la}&limit=1${t}`,{signal:ac.signal});return r.ok?(await r.json()).features?.[0]?.properties:null}catch(e){return null}finally{clearTimeout(tm)}};
  const[q,w]=await Promise.all([get(''),get('&type=locality')]);   // adresse la plus proche (commune) + lieu-dit le plus proche
  if(q&&q.citycode)return{insee:String(q.citycode),city:q.city,dist:q.distance,ld:w&&w.type=='locality'&&w.citycode==q.citycode&&w.name&&(w.distance==null||w.distance<=300)?w.name:''}}
  return null})();
 BC.set(k,p);p.then(v=>{if(!v)BC.delete(k)});return p}
let COMM;const comm=i=>{if(!COMM){COMM={};for(const[s,l]of Object.entries(D.communes))l.forEach(c=>COMM[c[0]]={site:s,name:c[1]})}return COMM[i]};
const LOC=async(la,lo,tol)=>{const[rs,b]=await Promise.all([findRd(la,lo,tol).catch(()=>null),ban(la,lo)]);return{rs,b,tol}};
const prTxt=r=>r.pr==null?'PR indisponible':r.m>=0?`PR ${r.pr}+${r.m}`:`≈ ${-r.m} m avant le PR ${r.pr}`;
const locTxt=x=>[x.rs&&x.rs[0]?`${shortRd(x.rs[0].axe)} · ${prTxt(x.rs[0])}${x.rs[0].approx?' (estimé)':''}`:x.rs?`aucune RD à moins de ${Math.round(x.tol)} m`:'référentiel RD indisponible',
 x.b?(comm(x.b.insee)?.name||x.b.city):'commune non déterminée (hors ligne ?)'].join(' · ');
const ensOpt=(s,v)=>{if(v&&![...s.options].some(o=>o.value==v))s.add(new Option(v))};
let autoRd=false,autoLd=false,LR=null,LRS=[],lseq=0;
function setRd(r){ensOpt(F.rd,r.axe);F.rd.value=r.axe;popPR();
 if(r.pr==null){F.abs.value=''}else{ensOpt(F.pr,r.pr);F.pr.value=r.pr;F.abs.value=r.m}calc()}
function setSite(k){if(!k||F.site.value==k)return;const c=F.commune.value;F.site.value=k;popC();if(c){ensOpt(F.commune,c);F.commune.value=c}}
function setCom(b){const n=comm(b.insee)?.name||b.city;ensOpt(F.commune,n);F.commune.value=n}
function locStatus(x){const alt=(x.rs||[]).slice(1),r=x.rs&&x.rs[0];
 $('#locst').textContent='✔ '+locTxt(x)+(r&&r.site?' · site '+siteTxt(r.site):'')+(x.b&&x.b.ld?' · '+x.b.ld:'')+(x.b&&x.b.dist>400?` (adresse BAN la plus proche à ${Math.round(x.b.dist)} m : vérifiez la commune)`:'');
 $('#localt').innerHTML=alt.length?'<span class="m">Autre(s) route(s) proche(s) :</span>'+alt.map((r,i)=>`<button type="button" class="s" data-alt="${i+1}">${esc(shortRd(r.axe))} · ${esc(prTxt(r))}</button>`).join(''):''}
function applyLoc(x){LRS=x.rs||[];LR=LRS[0]||null;
 setSite(LR&&LR.site||(x.b&&comm(x.b.insee)?.site));   // le site vient d'abord du segment de RD, à défaut de la commune
 if(x.b){setCom(x.b);
  if(x.b.ld&&(!F.lieudit.value||autoLd)){F.lieudit.value=x.b.ld;autoLd=true}else if(!x.b.ld&&autoLd){F.lieudit.value='';autoLd=false}}
 if(LR){setRd(LR);autoRd=true}else if(x.rs&&autoRd){F.rd.value='';popPR();F.abs.value='';calc();autoRd=false}
 locStatus(x);
 if(!x.rs||!LR||!x.b)toast(!x.b?'Commune non déterminée (connexion ?)':!x.rs?'Référentiel RD indisponible':'Aucune RD à proximité : renseignez la RD')}
async function autoLoc(la,lo,tol){const s=++lseq;$('#locst').textContent='⏳ Détermination de la RD, du PR et de la commune…';$('#localt').innerHTML='';
 const x=await LOC(la,lo,tol);if(s===lseq)applyLoc(x)}
function pickAlt(i){const r=LRS[i];if(!r)return;LR=r;setSite(r.site);setRd(r);autoRd=true;
 $('#locst').textContent='✔ '+shortRd(r.axe)+' · '+prTxt(r)+(r.approx?' (estimé)':'')+(r.site?' · site '+siteTxt(r.site):'');$('#localt').innerHTML=''}
// --- fin localisation automatique
// --- carte, recherche de lieu, guidage
let map,mk,pt,me;
const nav=(la,lo,w)=>open(w=='waze'?`https://waze.com/ul?ll=${la},${lo}&navigate=yes`:ios?`https://maps.apple.com/?daddr=${la},${lo}&dirflg=d`:`https://www.google.com/maps/dir/?api=1&destination=${la},${lo}&travelmode=driving`,'_blank');
let pseq=0;
function setPt(la,lo){const mpp=156543.03*Math.cos(la*Math.PI/180)/2**map.getZoom();pt={la,lo,tol:Math.max(30,Math.min(300,35*mpp))};
 if(!mk){mk=L.marker([la,lo],{draggable:true,icon:L.divIcon({html:'<div class="pin">📍</div>',className:'',iconSize:[30,30],iconAnchor:[15,30]})}).addTo(map);
  mk.on('dragend',()=>{const p=mk.getLatLng();setPt(p.lat,p.lng)})}else mk.setLatLng([la,lo]);
 $('#mi').textContent=`Point : ${la.toFixed(6)} ; ${lo.toFixed(6)}`;$('#mu').disabled=$('#mg').disabled=$('#mw').disabled=false;
 const s=++pseq,p=pt;LOC(la,lo,p.tol).then(x=>{if(s===pseq&&pt===p)$('#mi').textContent=`Point : ${la.toFixed(6)} ; ${lo.toFixed(6)} — ${locTxt(x)}`})}
function clearPt(){pt=null;pseq++;if(mk){map.removeLayer(mk);mk=null}$('#mi').textContent='Touchez la carte pour placer un point';$('#mu').disabled=$('#mg').disabled=$('#mw').disabled=true}
function openMap(m){if(!window.L)return toast('Carte indisponible : connexion requise la 1re fois');
 $('#mo').hidden=false;$('#sr').hidden=true;$('#mu').hidden=m!='form';
 if(!map){map=L.map('mapc').setView([47.66,-2.56],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© OpenStreetMap'}).addTo(map);
  map.on('click',e=>setPt(e.latlng.lat,e.latlng.lng))}
 clearPt();$('#sq').value=m=='form'?[F.lieudit.value,F.commune.value].filter(Boolean).join(' '):'';
 setTimeout(()=>{map.invalidateSize();const la=parseFloat(F.lat.value),lo=parseFloat(F.lon.value);
  if(m=='form'&&!isNaN(la)&&!isNaN(lo)){setPt(la,lo);map.setView([la,lo],16)}},60)}
$('#mapb').onclick=()=>openMap('free');
$('#mx').onclick=()=>$('#mo').hidden=true;
$('#mg').onclick=()=>pt&&nav(pt.la,pt.lo);$('#mw').onclick=()=>pt&&nav(pt.la,pt.lo,'waze');
$('#mu').onclick=()=>{if(!pt)return;F.lat.value=pt.la.toFixed(6);F.lon.value=pt.lo.toFixed(6);F.gps_prec.value='';F.loc_source.value='Carte (pointé)';
 $('#mo').hidden=true;toast('Point enregistré depuis la carte');autoLoc(pt.la,pt.lo,pt.tol)};
$('#mp').onclick=()=>{if(!navigator.geolocation)return toast('GPS indisponible');
 navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];map.setView(c,16);
  if(me)map.removeLayer(me);me=L.circleMarker(c,{radius:8,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(map)},
  er=>toast('GPS : '+er.message),{enableHighAccuracy:true,timeout:20000})};
$('#sf').onsubmit=async e=>{e.preventDefault();const q=$('#sq').value.trim();if(!q)return;
 const m=q.match(/^(-?\d+(?:[.,]\d+)?)\s*[;,\s]\s*(-?\d+(?:[.,]\d+)?)$/);
 if(m){const la=+m[1].replace(',','.'),lo=+m[2].replace(',','.');map.setView([la,lo],17);setPt(la,lo);return}
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=fr&accept-language=fr&q='+encodeURIComponent(q));
  const j=await r.json();if(!j.length)return toast('Aucun résultat');
  $('#sr').innerHTML=j.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.display_name)}</button>`).join('');$('#sr').hidden=false;
  $('#sr').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const x=j[b.dataset.i],la=+x.lat,lo=+x.lon;
   map.setView([la,lo],17);setPt(la,lo);$('#sr').hidden=true}}
 catch(x){toast('Recherche impossible (hors connexion ?)')}};
Promise.all([fetch('donnees.json').then(r=>r.json()),loadPh()]).then(([d])=>{D=d;build();renderList()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
navigator.storage?.persist?.();
</script></body></html>
